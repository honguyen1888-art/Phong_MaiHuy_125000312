<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD56B"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#9E6812"/>
    </linearGradient>
    <filter id="honeyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="260" cy="200" r="170" fill="#E5A93C" opacity="0.12"/>
  <circle cx="390" cy="90" r="45" fill="#E5A93C" opacity="0.08"/>

  <!-- Pedestal Platform (Dark & Honey) -->
  <ellipse cx="260" cy="330" rx="190" ry="40" fill="#141414"/>
  <ellipse cx="260" cy="326" rx="180" ry="34" fill="#1F1F1F" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Centerpiece: Exclusive Collectibles Display -->
  <!-- Figure Stand -->
  <rect x="210" y="110" width="100" height="190" rx="12" fill="#1E1E1E" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Figure Silhouette Art -->
  <path d="M260 135 C270 135 278 143 278 153 C278 163 272 170 260 172 C248 170 242 163 242 153 C242 143 250 135 260 135 Z" fill="url(#goldGrad)"/>
  <path d="M245 175 L275 175 L285 240 L235 240 Z" fill="#E5A93C" opacity="0.85"/>
  <rect x="240" y="245" width="15" height="45" fill="#141414"/>
  <rect x="265" y="245" width="15" height="45" fill="#141414"/>

  <!-- Left: Limited Pokemon Box / TCG Display -->
  <g transform="translate(90, 150)">
    <rect x="0" y="0" width="100" height="135" rx="8" fill="#141414" stroke="#E5A93C" stroke-width="1.8"/>
    <!-- Pokeball Design -->
    <circle cx="50" cy="60" r="28" fill="#FFFFFF" stroke="#E5A93C" stroke-width="2"/>
    <path d="M22 60 A28 28 0 0 1 78 60 Z" fill="#E5A93C"/>
    <circle cx="50" cy="60" r="8" fill="#FFFFFF" stroke="#141414" stroke-width="2"/>
    <circle cx="50" cy="60" r="4" fill="#E5A93C"/>
    <text x="50" y="115" font-family="sans-serif" font-size="10" font-weight="900" fill="#E5A93C" text-anchor="middle">POKÉMON CENTER</text>
  </g>

  <!-- Right: Exclusive Light Novel / Manga Boxset -->
  <g transform="translate(330, 160)">
    <rect x="0" y="0" width="95" height="125" rx="6" fill="#141414" stroke="#E5A93C" stroke-width="1.8"/>
    <rect x="8" y="8" width="80" height="108" fill="#FFFFFF" rx="4"/>
    <rect x="15" y="20" width="65" height="8" rx="2" fill="#141414"/>
    <rect x="15" y="34" width="45" height="5" rx="2" fill="#E5A93C"/>
    <circle cx="48" cy="70" r="20" fill="#FFF4D9"/>
    <!-- Signed ribbon badge -->
    <rect x="0" y="90" width="95" height="20" fill="url(#goldGrad)"/>
    <text x="47" y="104" font-family="sans-serif" font-size="8.5" font-weight="900" fill="#141414" text-anchor="middle">BẢN ĐẶC BIỆT KÈM OBI</text>
  </g>

  <!-- Floating Exclusive Tag Badge -->
  <g transform="translate(50, 70)" filter="url(#honeyGlow)">
    <rect x="0" y="0" width="150" height="48" rx="10" fill="#141414" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="24" cy="24" r="14" fill="url(#goldGrad)"/>
    <text x="24" y="29" font-family="sans-serif" font-size="12" font-weight="bold" fill="#141414" text-anchor="middle">★</text>
    <text x="46" y="21" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">100% ĐỘC QUYỀN</text>
    <text x="46" y="37" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#E5A93C">Chính Hãng Nội Địa Nhật</text>
  </g>

  <!-- Floating Limited Stock Badge -->
  <g transform="translate(325, 60)">
    <rect x="0" y="0" width="145" height="45" rx="10" fill="#E5A93C"/>
    <text x="18" y="20" font-family="sans-serif" font-size="11" font-weight="900" fill="#141414">SỐ LƯỢNG GIỚI HẠN</text>
    <text x="18" y="35" font-family="sans-serif" font-size="9" font-weight="700" fill="#141414" opacity="0.85">Chỉ 50 Bản Trên Toàn Quốc</text>
  </g>
</svg>
