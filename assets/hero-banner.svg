<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="30%" stop-color="#FFD56B"/>
      <stop offset="70%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#9E6812"/>
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#E5A93C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E5A93C" stop-opacity="0"/>
    </radialGradient>
    <filter id="honeyGlowHero" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Big Ambient Radiant Aura filling the canvas -->
  <circle cx="310" cy="270" r="250" fill="url(#auraGlow)"/>
  
  <!-- Sparkles / Star Lights -->
  <g fill="#FFD56B" opacity="0.8">
    <path d="M120 100 L123 110 L133 113 L123 116 L120 126 L117 116 L107 113 L117 110 Z"/>
    <path d="M500 130 L502 138 L510 140 L502 142 L500 150 L498 142 L490 140 L498 138 Z" transform="scale(0.8) translate(120, -10)"/>
    <path d="M480 380 L482 388 L490 390 L482 392 L480 400 L478 392 L470 390 L478 388 Z"/>
    <circle cx="160" cy="80" r="2.5"/>
    <circle cx="450" cy="90" r="3"/>
    <circle cx="90" cy="380" r="2"/>
    <circle cx="530" cy="320" r="2.5"/>
  </g>

  <!-- Grand Pedestal Platform (Bục Trưng Bày Đẳng Cấp Hoàng Gia) -->
  <ellipse cx="310" cy="460" rx="260" ry="52" fill="#0C0C0C"/>
  <ellipse cx="310" cy="452" rx="245" ry="46" fill="url(#pedestalGrad)" stroke="url(#goldGradHero)" stroke-width="3"/>
  <ellipse cx="310" cy="445" rx="225" ry="38" fill="#181818" stroke="url(#goldGradHero)" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- ================= CENTER: SCALE FIGURE SHOWCASE (TO LỚN, UY NGHI) ================= -->
  <g id="figure-centerpiece">
    <!-- Acrylic/Glass Showcase Pillar -->
    <rect x="235" y="110" width="150" height="295" rx="18" fill="#1C1C1C" stroke="url(#goldGradHero)" stroke-width="3"/>
    <rect x="245" y="120" width="130" height="275" rx="12" fill="#141414" stroke="#333333" stroke-width="1.5"/>
    
    <!-- Figure Body Silhouette & Golden Kimono -->
    <circle cx="310" cy="170" r="28" fill="url(#goldGradHero)"/>
    <circle cx="310" cy="170" r="24" fill="#FFFFFF"/>
    <!-- Head details -->
    <path d="M295 162 C295 152 325 152 325 162 C325 174 318 182 310 184 C302 182 295 174 295 162 Z" fill="url(#goldGradHero)"/>
    <!-- Kimono Dress Flowing -->
    <path d="M280 200 L340 200 L355 310 L265 310 Z" fill="url(#goldGradHero)"/>
    <path d="M290 205 L330 205 L342 305 L278 305 Z" fill="#141414"/>
    <path d="M298 210 L322 210 L330 300 L290 300 Z" fill="url(#goldGradHero)" opacity="0.9"/>
    <!-- Feet stand -->
    <rect x="290" y="315" width="16" height="55" rx="3" fill="#141414"/>
    <rect x="314" y="315" width="16" height="55" rx="3" fill="#141414"/>

    <!-- WonFes Label Badge on Base -->
    <rect x="252" y="355" width="116" height="28" rx="7" fill="url(#goldGradHero)"/>
    <text x="310" y="373" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#141414" text-anchor="middle" letter-spacing="1">WONFES 1/7 SCALE</text>
  </g>

  <!-- ================= LEFT: POKÉMON CENTER EXCLUSIVE BOX & POKÉBALL ================= -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="160" height="225" rx="14" fill="#161616" stroke="url(#goldGradHero)" stroke-width="2.5"/>
    
    <!-- Top Pokemon Center Header strip -->
    <path d="M0 14 C0 6.2 6.2 0 14 0 L146 0 C153.8 0 160 6.2 160 14 L160 38 L0 38 Z" fill="#222222"/>
    <text x="80" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#E5A93C" text-anchor="middle" letter-spacing="1">POKÉMON CENTER TOKYO</text>
    
    <!-- Pokeball Big Graphic -->
    <circle cx="80" cy="115" r="42" fill="#FFFFFF" stroke="#E5A93C" stroke-width="3"/>
    <path d="M38 115 A42 42 0 0 1 122 115 Z" fill="#E5A93C"/>
    <line x1="38" y1="115" x2="122" y2="115" stroke="#141414" stroke-width="5"/>
    <circle cx="80" cy="115" r="14" fill="#FFFFFF" stroke="#141414" stroke-width="3.5"/>
    <circle cx="80" cy="115" r="6" fill="#E5A93C"/>
    
    <!-- Card details inside -->
    <rect x="18" y="175" width="124" height="34" rx="8" fill="#1F1F1F" stroke="#E5A93C" stroke-width="1.5"/>
    <text x="80" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TCG GOLD COLLECTION</text>
  </g>

  <!-- ================= RIGHT: LIGHT NOVEL DELUXE BOXSET & OBI ================= -->
  <g transform="translate(400, 170)">
    <rect x="0" y="0" width="160" height="215" rx="14" fill="#161616" stroke="url(#goldGradHero)" stroke-width="2.5"/>
    
    <!-- Manga/Novel Hardcover Stack -->
    <rect x="14" y="14" width="132" height="187" rx="8" fill="#FFFFFF" stroke="#141414" stroke-width="3"/>
    <rect x="24" y="28" width="112" height="12" rx="3" fill="#141414"/>
    <rect x="24" y="46" width="75" height="7" rx="2" fill="#E5A93C"/>
    <circle cx="80" cy="100" r="30" fill="#FFF4D9" stroke="#E5A93C" stroke-width="2"/>
    <text x="80" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#E5A93C" text-anchor="middle">LN</text>
    
    <!-- Obi Ribbon strip (Đai sách Nhật Bản) -->
    <rect x="14" y="142" width="132" height="38" fill="url(#goldGradHero)"/>
    <text x="80" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#141414" text-anchor="middle" letter-spacing="0.5">BẢN ĐẶC BIỆT KÈM OBI</text>
  </g>

  <!-- ================= FLOATING BADGES (TOP-LEFT & TOP-RIGHT HOÀNG GIA) ================= -->
  <!-- Top Left: 100% ĐỘC QUYỀN -->
  <g transform="translate(30, 45)" filter="url(#honeyGlowHero)">
    <rect x="0" y="0" width="225" height="66" rx="14" fill="#141414" stroke="url(#goldGradHero)" stroke-width="2.8"/>
    <circle cx="34" cy="33" r="18" fill="url(#goldGradHero)"/>
    <text x="34" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#141414" text-anchor="middle">★</text>
    <text x="64" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" letter-spacing="0.8">100% ĐỘC QUYỀN</text>
    <text x="64" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#E5A93C">Chính Hãng Nội Địa Nhật Bản</text>
  </g>

  <!-- Top Right: SỐ LƯỢNG GIỚI HẠN -->
  <g transform="translate(365, 35)">
    <rect x="0" y="0" width="225" height="64" rx="14" fill="#E5A93C" stroke="#141414" stroke-width="2.5"/>
    <text x="24" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="900" fill="#141414" letter-spacing="0.8">SỐ LƯỢNG GIỚI HẠN</text>
    <text x="24" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#141414" opacity="0.9">Chỉ 50 Bản Phát Hành Toàn Quốc</text>
  </g>
</svg>
