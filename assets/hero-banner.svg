<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD56B"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#9E6812"/>
    </linearGradient>
    <filter id="honeyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="270" cy="210" r="180" fill="#E5A93C" opacity="0.12"/>
  <circle cx="410" cy="95" r="45" fill="#E5A93C" opacity="0.08"/>

  <!-- Pedestal Platform -->
  <ellipse cx="270" cy="345" rx="200" ry="42" fill="#141414"/>
  <ellipse cx="270" cy="340" rx="190" ry="36" fill="#1F1F1F" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Centerpiece: Exclusive Figure Display -->
  <rect x="215" y="115" width="110" height="200" rx="14" fill="#1E1E1E" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="270" cy="155" r="20" fill="url(#goldGrad)"/>
  <path d="M255 180 L285 180 L295 245 L245 245 Z" fill="#E5A93C" opacity="0.9"/>
  <rect x="250" y="250" width="16" height="50" fill="#141414"/>
  <rect x="274" y="250" width="16" height="50" fill="#141414"/>

  <!-- Left: Limited Pokemon Box / TCG Display (MỞ RỘNG CARD VÀ CHỮ HOÀN TOÀN TRONG KHUNG) -->
  <g transform="translate(75, 155)">
    <rect x="0" y="0" width="125" height="150" rx="10" fill="#141414" stroke="#E5A93C" stroke-width="2"/>
    <!-- Pokeball Design -->
    <circle cx="62.5" cy="62" r="30" fill="#FFFFFF" stroke="#E5A93C" stroke-width="2.5"/>
    <path d="M32.5 62 A30 30 0 0 1 92.5 62 Z" fill="#E5A93C"/>
    <circle cx="62.5" cy="62" r="9" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/>
    <circle cx="62.5" cy="62" r="4.5" fill="#E5A93C"/>
    <!-- Khung nhãn không tràn viền -->
    <rect x="8" y="108" width="109" height="26" rx="6" fill="#1F1F1F" stroke="#E5A93C" stroke-width="1.2"/>
    <text x="62.5" y="125" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#E5A93C" text-anchor="middle" letter-spacing="0.5">POKÉMON CENTER</text>
  </g>

  <!-- Right: Exclusive Light Novel Boxset (MỞ RỘNG CARD VÀ OBI ĐỂ KHÔNG TRÀN VIỀN) -->
  <g transform="translate(340, 165)">
    <rect x="0" y="0" width="125" height="140" rx="10" fill="#141414" stroke="#E5A93C" stroke-width="2"/>
    <rect x="10" y="10" width="105" height="120" fill="#FFFFFF" rx="6"/>
    <rect x="20" y="22" width="85" height="8" rx="2" fill="#141414"/>
    <rect x="20" y="36" width="60" height="5" rx="2" fill="#E5A93C"/>
    <circle cx="62.5" cy="72" r="22" fill="#FFF4D9"/>
    <!-- Signed ribbon badge đai Obi: Rộng 105px nằm gọn trong thẻ sách -->
    <rect x="10" y="96" width="105" height="26" fill="url(#goldGrad)" rx="2"/>
    <text x="62.5" y="113" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.2" font-weight="900" fill="#141414" text-anchor="middle">BẢN ĐẶC BIỆT KÈM OBI</text>
  </g>

  <!-- Floating Exclusive Tag Badge (Top Left): TĂNG KÍCH THƯỚC KHUNG 190x56 ĐỂ CHỮ KHÔNG TRÀN -->
  <g transform="translate(45, 65)" filter="url(#honeyGlow)">
    <rect x="0" y="0" width="195" height="58" rx="12" fill="#141414" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="28" cy="29" r="16" fill="url(#goldGrad)"/>
    <text x="28" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#141414" text-anchor="middle">★</text>
    <text x="54" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">100% ĐỘC QUYỀN</text>
    <text x="54" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#E5A93C">Chính Hãng Nội Địa Nhật</text>
  </g>

  <!-- Floating Limited Stock Badge (Top Right): TĂNG KÍCH THƯỚC KHUNG 185x54 ĐỂ CHỮ KHÔNG TRÀN -->
  <g transform="translate(315, 55)">
    <rect x="0" y="0" width="185" height="54" rx="12" fill="#E5A93C" stroke="#141414" stroke-width="2"/>
    <text x="20" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#141414" letter-spacing="0.5">SỐ LƯỢNG GIỚI HẠN</text>
    <text x="20" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.8" font-weight="700" fill="#141414" opacity="0.9">Chỉ 50 Bản Trên Toàn Quốc</text>
  </g>
</svg>
