<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#FFD56B"/>
      <stop offset="70%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#A56E14"/>
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#E5A93C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E5A93C" stop-opacity="0"/>
    </radialGradient>
    <filter id="honeyGlowHero" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Radiant Aura -->
  <circle cx="290" cy="220" r="210" fill="url(#auraGlow)"/>

  <!-- Sparkles -->
  <g fill="#FFD56B" opacity="0.85">
    <path d="M100 80 L102 88 L110 90 L102 92 L100 100 L98 92 L90 90 L98 88 Z"/>
    <path d="M480 90 L482 98 L490 100 L482 102 L480 110 L478 102 L470 100 L478 98 Z"/>
    <circle cx="150" cy="65" r="2.5"/>
    <circle cx="430" cy="70" r="2.5"/>
    <circle cx="80" cy="340" r="2"/>
    <circle cx="500" cy="320" r="2.5"/>
  </g>

  <!-- Pedestal Platform (Bục Trưng Bày Tiêu Chuẩn) -->
  <ellipse cx="290" cy="380" rx="230" ry="42" fill="#0E0E0E"/>
  <ellipse cx="290" cy="374" rx="218" ry="37" fill="url(#pedestalGrad)" stroke="url(#goldGradHero)" stroke-width="2.5"/>
  <ellipse cx="290" cy="368" rx="200" ry="30" fill="#181818" stroke="url(#goldGradHero)" stroke-width="1.2" stroke-dasharray="5 3"/>

  <!-- ================= CENTER: SCALE FIGURE SHOWCASE ================= -->
  <g id="figure-centerpiece">
    <!-- Acrylic Glass Showcase Pillar -->
    <rect x="225" y="85" width="130" height="255" rx="14" fill="#1C1C1C" stroke="url(#goldGradHero)" stroke-width="2.5"/>
    <rect x="233" y="93" width="114" height="239" rx="10" fill="#141414" stroke="#2C2C2C" stroke-width="1.2"/>
    
    <!-- Figure Body Silhouette & Golden Kimono -->
    <circle cx="290" cy="138" r="24" fill="url(#goldGradHero)"/>
    <circle cx="290" cy="138" r="20" fill="#FFFFFF"/>
    <path d="M276 132 C276 122 304 122 304 132 C304 142 298 149 290 151 C282 149 276 142 276 132 Z" fill="url(#goldGradHero)"/>
    
    <!-- Flowing Kimono Dress -->
    <path d="M265 165 L315 165 L328 260 L252 260 Z" fill="url(#goldGradHero)"/>
    <path d="M273 170 L307 170 L318 255 L262 255 Z" fill="#141414"/>
    <path d="M280 174 L300 174 L308 250 L272 250 Z" fill="url(#goldGradHero)" opacity="0.9"/>
    
    <!-- Stand -->
    <rect x="274" y="265" width="14" height="42" rx="2" fill="#141414"/>
    <rect x="292" y="265" width="14" height="42" rx="2" fill="#141414"/>

    <!-- WonFes Label Badge on Base: Đủ chỗ, chữ nằm đẹp đẽ -->
    <rect x="240" y="296" width="100" height="25" rx="6" fill="url(#goldGradHero)"/>
    <text x="290" y="312" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#141414" text-anchor="middle" letter-spacing="0.5">WONFES 1/7 SCALE</text>
  </g>

  <!-- ================= LEFT: POKÉMON CENTER TCG BOX ================= -->
  <g transform="translate(65, 125)">
    <rect x="0" y="0" width="145" height="205" rx="12" fill="#161616" stroke="url(#goldGradHero)" stroke-width="2"/>
    <path d="M0 12 C0 5.4 5.4 0 12 0 L133 0 C139.6 0 145 5.4 145 12 L145 32 L0 32 Z" fill="#222222"/>
    <text x="72.5" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="900" fill="#E5A93C" text-anchor="middle" letter-spacing="0.5">POKÉMON CENTER TOKYO</text>
    
    <!-- Pokeball Graphic -->
    <circle cx="72.5" cy="100" r="38" fill="#FFFFFF" stroke="#E5A93C" stroke-width="2.5"/>
    <path d="M34.5 100 A38 38 0 0 1 110.5 100 Z" fill="#E5A93C"/>
    <line x1="34.5" y1="100" x2="110.5" y2="100" stroke="#141414" stroke-width="4.5"/>
    <circle cx="72.5" cy="100" r="13" fill="#FFFFFF" stroke="#141414" stroke-width="3"/>
    <circle cx="72.5" cy="100" r="5.5" fill="#E5A93C"/>
    
    <!-- Card details label: Không tràn viền -->
    <rect x="12" y="156" width="121" height="30" rx="7" fill="#1F1F1F" stroke="#E5A93C" stroke-width="1.2"/>
    <text x="72.5" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">TCG GOLD COLLECTION</text>
  </g>

  <!-- ================= RIGHT: LIGHT NOVEL DELUXE BOXSET & OBI ================= -->
  <!-- SỬA LỖI CHÍNH TẢ: 'BẢN ĐẶC BIỆT KÈM OBI' CÓ ĐỦ CHỮ I, NẰM TRỌN TRONG ĐAI SÁCH -->
  <g transform="translate(370, 135)">
    <rect x="0" y="0" width="145" height="195" rx="12" fill="#161616" stroke="url(#goldGradHero)" stroke-width="2"/>
    
    <!-- Hardcover Book -->
    <rect x="10" y="10" width="125" height="175" rx="8" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/>
    <rect x="20" y="22" width="105" height="10" rx="2" fill="#141414"/>
    <rect x="20" y="38" width="70" height="6" rx="2" fill="#E5A93C"/>
    <circle cx="72.5" cy="88" r="26" fill="#FFF4D9" stroke="#E5A93C" stroke-width="1.8"/>
    <text x="72.5" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#E5A93C" text-anchor="middle">LN</text>
    
    <!-- Đai sách Obi Nhật Bản: Rộng 125px phủ trọn bề ngang cuốn sách, căn giữa chữ chuẩn xác -->
    <rect x="10" y="130" width="125" height="34" fill="url(#goldGradHero)"/>
    <text x="72.5" y="151" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.8" font-weight="900" fill="#141414" text-anchor="middle" letter-spacing="0.4">BẢN ĐẶC BIỆT KÈM OBI</text>
  </g>

  <!-- ================= FLOATING BADGES (TỶ LỆ VỪA VẶN, ĐẸP MẮT) ================= -->
  <!-- Top Left: 100% ĐỘC QUYỀN -->
  <g transform="translate(40, 30)" filter="url(#honeyGlowHero)">
    <rect x="0" y="0" width="190" height="52" rx="10" fill="#141414" stroke="url(#goldGradHero)" stroke-width="2"/>
    <circle cx="26" cy="26" r="14" fill="url(#goldGradHero)"/>
    <text x="26" y="31" font-family="sans-serif" font-size="13" font-weight="bold" fill="#141414" text-anchor="middle">★</text>
    <text x="50" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">100% ĐỘC QUYỀN</text>
    <text x="50" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#E5A93C">Chính Hãng Nội Địa Nhật Bản</text>
  </g>

  <!-- Top Right: SỐ LƯỢNG GIỚI HẠN -->
  <g transform="translate(340, 22)">
    <rect x="0" y="0" width="190" height="50" rx="10" fill="#E5A93C" stroke="#141414" stroke-width="1.8"/>
    <text x="20" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#141414" letter-spacing="0.5">SỐ LƯỢNG GIỚI HẠN</text>
    <text x="20" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#141414" opacity="0.9">Chỉ 50 Bản Phát Hành Toàn Quốc</text>
  </g>
</svg>
