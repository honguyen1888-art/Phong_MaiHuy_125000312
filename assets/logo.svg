<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="honeyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#C48721" />
    </linearGradient>
  </defs>
  <!-- Hexagon Honeycomb Icon -->
  <polygon points="30,8 50,19 50,41 30,52 10,41 10,19" fill="#141414" stroke="url(#honeyGold)" stroke-width="2.5"/>
  <!-- Crown inside hexagon for exclusivity -->
  <path d="M20 36 L20 26 L25 30 L30 22 L35 30 L40 26 L40 36 Z" fill="url(#honeyGold)"/>
  <circle cx="20" cy="24" r="1.5" fill="#FFFFFF"/>
  <circle cx="30" cy="20" r="1.8" fill="#FFFFFF"/>
  <circle cx="40" cy="24" r="1.5" fill="#FFFFFF"/>
  <!-- Brand Name with classes for inline styling and high contrast -->
  <text x="62" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1">
    <tspan class="logo-honey-word" fill="#141414">HONEY</tspan><tspan fill="#E5A93C">VAULT</tspan>
  </text>
  <text x="62" y="47" class="logo-sub-text" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#666666" letter-spacing="2.5">SẢN PHẨM ĐỘC QUYỀN NHẬT BẢN</text>
</svg>
