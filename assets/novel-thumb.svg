<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260">
  <defs>
    <linearGradient id="novelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FBEFD9"/>
    </linearGradient>
  </defs>
  <rect width="320" height="260" rx="16" fill="url(#novelGrad)"/>
  
  <!-- Back book -->
  <rect x="80" y="42" width="115" height="145" rx="6" fill="#141414" transform="rotate(-8 140 115)"/>
  
  <!-- Front book -->
  <g transform="translate(115, 32)">
    <rect x="0" y="0" width="115" height="155" rx="6" fill="#FFFFFF" stroke="#141414" stroke-width="3"/>
    <rect x="14" y="16" width="87" height="10" rx="2" fill="#E5A93C"/>
    <rect x="14" y="34" width="60" height="6" rx="2" fill="#141414"/>
    <circle cx="57" cy="80" r="24" fill="#FBEFD9" stroke="#E5A93C" stroke-width="2"/>
    <text x="57" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#E5A93C" text-anchor="middle">LN</text>
    <!-- Obi strip (Đai sách Nhật Bản): Mở rộng chiều rộng -->
    <rect x="0" y="118" width="115" height="30" fill="#E5A93C"/>
    <text x="57.5" y="137" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#141414" text-anchor="middle">BẢN ĐẶC BIỆT OBI</text>
  </g>
  
  <!-- Tag Pill: MỞ RỘNG ĐỂ CHỮ NẰM TRONG KHUNG -->
  <rect x="35" y="200" width="250" height="38" rx="10" fill="#141414" stroke="#E5A93C" stroke-width="1.8"/>
  <text x="160" y="224" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#E5A93C" text-anchor="middle" letter-spacing="1">LIGHT NOVEL &amp; MANGA</text>
</svg>
